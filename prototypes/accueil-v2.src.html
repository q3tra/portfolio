<title>Prototype theoooo.studio v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Host+Grotesk:wght@300;400;500&display=swap">
<style>
/* v2 : menu à rubriques (logique Norm), lamelles qui se déforment à la vitesse (logique Aristide Benoist), ouverture plein écran puis Explore (fiche à la Rauno). Chargement : le signe devient le nom + règle graduée et compteur géant. */
:root{
  color-scheme:dark;
  --ink:#060708;
  --panel:#0c0e0f;
  --flash:#eeefed;
  --steel:#737a80;
  --dim:#30353a;
  --line:#1a1e21;
  --grot:"Host Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Fragment Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.7,0,.2,1);
  --out:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--flash);font-family:var(--mono);font-size:11px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.u{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.s{color:var(--steel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:1px solid var(--flash);outline-offset:3px}
#app{position:relative;height:100%;max-width:1720px;margin:0 auto}

/* ---------- Chargement ---------- */
#intro{position:fixed;inset:0;z-index:50;background:var(--ink);transition:opacity .7s}
#intro.gone{opacity:0;pointer-events:none}
#wm{position:absolute;left:50%;top:44%;width:min(66vw,720px);height:auto;overflow:visible;transform:translate(-50%,-50%);transform-origin:0 0;transition:transform 1.1s var(--ease)}
#wm text{font-family:var(--grot);font-weight:400;fill:var(--flash)}
#big{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-family:var(--grot);font-weight:300;font-size:clamp(90px,17vw,250px);line-height:.8;letter-spacing:-.06em;font-variant-numeric:tabular-nums;transition:opacity .4s,transform .8s var(--ease)}
#ruler{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:min(46vw,620px);display:grid;gap:10px;transition:opacity .4s}
#ticks{display:flex;justify-content:space-between;align-items:flex-end;height:26px}
#ticks i{display:block;width:1px;height:9px;background:var(--dim);transition:height .25s var(--out),background .25s}
#ticks i.on{background:var(--flash)}
#ticks i.on:nth-child(10n+1){height:26px}
#ticks i:nth-child(10n+1){height:16px}
#ruler .row{display:flex;justify-content:space-between}
#skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px))}

/* ---------- En-tête ---------- */
header{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:calc(20px + env(safe-area-inset-top,0px));z-index:20;opacity:0;transition:opacity .8s .2s}
.on header,.on .low,.on #scrub{opacity:1}
#logo{display:flex;gap:12px;align-items:center;color:var(--flash);text-decoration:none}
#logo svg{width:24px;height:24px;flex:none}
#logo span{font-family:var(--grot);font-size:clamp(20px,1.8vw,27px);letter-spacing:-.03em;line-height:1}
#menu{display:flex;gap:clamp(18px,2.4vw,40px)}
#menu > button{color:var(--steel);transition:color .25s;padding-block:8px}
#menu > button:hover,#menu > button[aria-expanded="true"],#menu > button.cur{color:var(--flash)}
#menu > button.cur::after{content:"";display:block;height:1px;background:var(--flash);margin-top:4px}
#burger{display:none}

/* Panneau des rubriques (comme Norm : la rubrique ouvre ses sous-rubriques) */
#drop{position:absolute;inset:0 0 auto;padding-top:calc(76px + env(safe-area-inset-top,0px));padding-bottom:30px;background:var(--ink);z-index:19;border-bottom:1px solid var(--line);clip-path:inset(0 0 100% 0);transition:clip-path .55s var(--ease)}
#drop.v{clip-path:inset(0 0 0 0)}
#drop .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:40px;align-items:end}
#drop h3{margin:0;font-family:var(--grot);font-weight:300;font-size:clamp(48px,6vw,96px);letter-spacing:-.05em;line-height:.85}
#drop ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 24px}
#drop li button{display:flex;justify-content:space-between;width:100%;padding:9px 0;border-bottom:1px solid var(--line);color:var(--steel);transition:color .2s,padding .3s var(--ease)}
#drop li button:hover{color:var(--flash);padding-left:8px}
#drop li sup{color:var(--dim);font-size:10px}
#drop p{margin:12px 0 0;color:var(--steel);max-width:40ch}

/* ---------- Règle de navigation ---------- */
#scrub{position:absolute;left:50%;transform:translateX(-50%);top:calc(86px + env(safe-area-inset-top,0px));width:min(52vw,560px);display:grid;gap:8px;z-index:5;opacity:0;transition:opacity .8s .4s}
#sticks{display:flex;justify-content:space-between;align-items:flex-end;height:18px}
#sticks i{display:block;width:1px;height:7px;background:var(--dim);transition:height .3s var(--out),background .3s}
#sticks i.a{height:18px;background:var(--flash)}
#scrub .row{display:flex;justify-content:space-between}

/* ---------- Lamelles ---------- */
#stage{position:absolute;inset:0;display:grid;align-items:center;overflow:hidden;z-index:1}
#track{display:flex;align-items:center;gap:10px;will-change:transform;height:min(50vh,470px);opacity:0;transition:opacity .6s}
.open #track{opacity:1}
.sl{flex:none;width:58px;height:100%;position:relative;overflow:hidden;cursor:pointer;transition:width .7s var(--ease),opacity .5s,filter .5s;clip-path:inset(50% 0 50% 0)}
.open .sl{clip-path:inset(0);transition:width .7s var(--ease),opacity .5s,filter .5s,clip-path 1s var(--ease) calc(var(--i) * 28ms)}
.sl img{position:absolute;left:50%;top:0;height:100%;width:auto;min-width:100%;object-fit:cover;transform:translateX(-50%);filter:grayscale(1) brightness(.85);transition:filter .5s}
.sl.a{width:clamp(220px,22vw,360px)}
.sl.a img{filter:none}
.sl.off{opacity:.12;pointer-events:none}
#track.h .sl:not(.a){filter:brightness(.55)}
.sl .tag{position:absolute;left:6px;bottom:6px;font-size:9.5px;letter-spacing:.1em;color:var(--flash);mix-blend-mode:difference}

/* ---------- Bas d'écran ---------- */
.low{position:absolute;inset:auto 0 0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5;opacity:0;transition:opacity .8s .5s;pointer-events:none}
#title{margin:0;font-family:var(--grot);font-weight:300;font-size:clamp(34px,4.4vw,68px);letter-spacing:-.045em;line-height:.95;min-height:1em;overflow:hidden}
#title span{display:inline-block;transition:transform .55s var(--ease),opacity .4s}
#title.out span{transform:translateY(105%);opacity:0}
#meta{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;justify-self:end;min-width:min(100%,320px)}
#meta dt{color:var(--dim)}
#meta dd{margin:0;color:var(--steel)}

/* ---------- Ouverture d'une œuvre ---------- */
#open{position:fixed;inset:0;z-index:30;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .45s}
#open.v{opacity:1;pointer-events:auto}
#fly{position:fixed;object-fit:cover;z-index:32;transition:left .9s var(--ease),top .9s var(--ease),width .9s var(--ease),height .9s var(--ease);pointer-events:none}
#letters{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;padding-inline:max(16px,env(safe-area-inset-left,0px));font-family:var(--grot);font-weight:400;font-size:clamp(70px,13vw,210px);letter-spacing:-.04em;line-height:1;z-index:31;pointer-events:none;mix-blend-mode:difference}
#letters span{display:inline-block;transform:translateY(40%);opacity:0;transition:transform .9s var(--out),opacity .6s}
#open.ready #letters span{transform:none;opacity:1;transition-delay:calc(var(--k) * 40ms + .35s)}
#open .bar{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));z-index:33}
#open .foot{position:absolute;inset:auto 0 0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:24px;align-items:end;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:33;opacity:0;transition:opacity .5s .7s}
#open.ready .foot{opacity:1}
#open dl{display:grid;grid-template-columns:auto auto 1fr;gap:3px 14px;margin:0}
#open dl span{color:var(--dim)}
#open dl dt{color:var(--steel)}
#open dl dd{margin:0}
#explore{display:grid;justify-items:center;gap:10px}
#explore::after{content:"";width:1px;height:46px;background:var(--flash);transform-origin:top;animation:drip 1.8s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#desc{margin:0;justify-self:end;text-align:right;max-width:36ch;color:var(--steel);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* ---------- Explore : la fiche ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:var(--ink);overflow:auto;transform:translateY(100%);transition:transform .9s var(--ease);padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
#sheet.v{transform:none}
#sheet .bar{display:flex;justify-content:space-between;position:sticky;top:0;padding-bottom:16px;background:var(--ink);z-index:2}
#sheet .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,5vw,80px);margin-top:8vh}
#sheet aside{position:sticky;top:60px;align-self:start;display:grid;gap:28px}
#sheet h2{margin:0;font-family:var(--grot);font-weight:300;font-size:clamp(40px,5vw,80px);letter-spacing:-.05em;line-height:.9}
#sheet .lede{margin:0;font-family:var(--grot);font-weight:300;font-size:18px;line-height:1.4;max-width:34ch;color:#cfd2d4}
#sheet table{border-collapse:collapse;width:100%}
#sheet td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
#sheet td:first-child{color:var(--steel);width:9ch}
#sheet .imgs{display:grid;gap:clamp(24px,6vh,80px)}
#sheet figure{margin:0;display:grid;gap:8px}
#sheet figure img{width:100%;height:auto;display:block}
#sheet .todo{border:1px dashed var(--dim);padding:40px;color:var(--steel);text-align:center}

/* ---------- Menu téléphone ---------- */
#mob{position:fixed;inset:0;z-index:45;background:var(--ink);padding:calc(80px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));overflow:auto;clip-path:inset(0 0 100% 0);transition:clip-path .6s var(--ease)}
#mob.v{clip-path:inset(0)}
#mob section{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:8px}
#mob h4{margin:0;font-family:var(--grot);font-weight:300;font-size:38px;letter-spacing:-.04em;line-height:1}
#mob .subs{display:flex;flex-wrap:wrap;gap:4px 14px}

@media (pointer:fine){ .sl{cursor:none} }
#cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;z-index:60;color:var(--flash);mix-blend-mode:difference;opacity:0;transition:opacity .2s}
#cur.v{opacity:1}
#cur svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s,transform .5s var(--ease)}
#cur .p{opacity:0;transform:rotate(-45deg)}
#cur.img .m{opacity:0;transform:rotate(45deg)}
#cur.img .p{opacity:1;transform:none}
@media (pointer:coarse){#cur{display:none}}

@media (max-width:820px){
  #menu{display:none}
  #burger{display:block}
  #scrub{width:calc(100% - 32px)}
  .low{grid-template-columns:minmax(0,1fr)}
  #meta{display:none}
  .sl{width:40px}
  .sl.a{width:190px}
  #open .foot{grid-template-columns:minmax(0,1fr);justify-items:start}
  #desc{justify-self:start;text-align:left}
  #sheet .grid{grid-template-columns:minmax(0,1fr)}
  #sheet aside{position:static}
  #ruler{width:calc(100% - 32px);bottom:auto;top:calc(64% + 0px)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>

    ['T','B','L','R'].forEach(function(n){var m=MIRE[n],e=arms[n],p=[0,1,2,3].map(function(k){var c=k%2?C.y:C.x;return lerp(lerp(c,m[k],go),TEE[n][k],tee)});e.setAttribute('x1',p[0]);e.setAttribute('y1',p[1]);e.setAttribute('x2',p[2]);e.setAttribute('y2',p[3]);e.setAttribute('stroke-width',go>0?w:0);});
    he.setAttribute('opacity',nm);he.setAttribute('transform','translate('+lerp(-14,0,nm)+',0)');
    var sn=ease(seg(s,4.3,5.1));st.setAttribute('opacity',sn);st.setAttribute('transform','translate('+lerp(-18,0,sn)+',0)');
    var p=Math.min(1,s/5.2),on=Math.round(p*(TK.length-1));
    TK.forEach(function(k,i){k.classList.toggle('on',i<=on)});
    $('#big').textContent=String(Math.round(p*100)).padStart(3,'0');
    $('#lw').textContent=p<.18?'four points':p<.37?'a quarter turn':p<.58?'a cross':p<.75?'t, o':'theoooo.studio';
  }
  var t0=null,done=false;
  function tick(now){if(done)return;if(t0===null)t0=now;var s=(now-t0)/1000;frame(Math.min(s,5.2));if(s<6)requestAnimationFrame(tick);else leave();}
  function leave(){
    if(done)return;done=true;frame(5.2);
    var a=$('#wm').getBoundingClientRect(),b=$('#logotxt').getBoundingClientRect();
    var sc=b.width/(a.width*.82);
    // le nom file vers la place du logo
    var cx=a.left,cy=a.top,wm=$('#wm');wm.style.transition='none';wm.style.left=cx+'px';wm.style.top=cy+'px';wm.style.transform='none';
    requestAnimationFrame(function(){requestAnimationFrame(function(){wm.style.transition='';wm.style.transform='translate('+(b.left-cx-a.width*.09*sc)+'px,'+(b.top-cy-a.height*.40*sc)+'px) scale('+sc+')';});});
    $('#big').style.transform='translateY(110%)';$('#big').style.opacity=0;$('#ruler').style.opacity=0;$('#skip').style.opacity=0;
    app.classList.add('on');
    setTimeout(function(){$('#intro').classList.add('gone')},900);
    setTimeout(function(){app.classList.add('open');measure();},1100);
    setTimeout(function(){$('#intro').remove()},1900);
  }
  $('#skip').addEventListener('click',leave);$('#intro').addEventListener('click',leave);
  if(reduce){frame(5.2);setTimeout(leave,400);}else requestAnimationFrame(tick);

  /* ---------- Menu à rubriques ---------- */
  var menu=$('#menu'),drop=$('#drop'),filt=null,closeT;
  MENU.forEach(function(m,mi){var b=document.createElement('button');b.type='button';b.className='u';b.textContent=m.k;b.setAttribute('aria-expanded','false');
    b.addEventListener('mouseenter',function(){showDrop(mi,b)});b.addEventListener('focus',function(){showDrop(mi,b)});
    b.addEventListener('click',function(){setFilter(m.k,null);hideDrop()});menu.appendChild(b);});
  function count(k,sub){return W.filter(function(w){return w.cat===k&&(!sub||w.sub===sub)}).length}
  function showDrop(mi,b){clearTimeout(closeT);var m=MENU[mi];$$('#menu > button').forEach(function(x){x.setAttribute('aria-expanded',x===b)});
    $('#dh').textContent=m.k;$('#dp').textContent=m.d;var ul=$('#dl');ul.innerHTML='';
    m.subs.forEach(function(s){var li=document.createElement('li');li.innerHTML='<button type="button" class="u"><span>'+s+'</span><sup>'+p2(count(m.k,s))+'</sup></button>';
      li.firstChild.addEventListener('click',function(){setFilter(m.k,s);hideDrop()});ul.appendChild(li);});
    drop.classList.add('v');drop.setAttribute('aria-hidden','false');}
  function hideDrop(){drop.classList.remove('v');drop.setAttribute('aria-hidden','true');$$('#menu > button').forEach(function(x){x.setAttribute('aria-expanded','false')});}
  $('header').addEventListener('mouseleave',function(e){if(!drop.contains(e.relatedTarget))closeT=setTimeout(hideDrop,180)});
  drop.addEventListener('mouseleave',function(e){if(!$('header').contains(e.relatedTarget))closeT=setTimeout(hideDrop,180)});
  drop.addEventListener('mouseenter',function(){clearTimeout(closeT)});
  function setFilter(k,sub){filt=k?{k:k,sub:sub}:null;
    $$('#menu > button').forEach(function(x){x.classList.toggle('cur',!!filt&&x.textContent===k)});
    $$('.sl').forEach(function(s){var w=W[s.dataset.i];s.classList.toggle('off',!!filt&&!(w.cat===k&&(!sub||w.sub===sub)))});
    $('#sf').textContent=filt?(k+(sub?' / '+sub:'')):'All';
    var n=filt?count(k,sub):W.length;$('#st2').textContent=p2(n);
    title(filt?(n?(sub||k)+', '+n+(n>1?' works':' work'):(sub||k)+': nothing yet'):'Drag, scroll, or hover.');}
  $('#logo').addEventListener('click',function(e){e.preventDefault();setFilter(null)});

  /* Menu téléphone */
  var mob=$('#mob');mob.innerHTML=MENU.map(function(m){return '<section><h4>'+m.k+'</h4><div class="subs u s">'+m.subs.map(function(s){return '<button type="button" data-k="'+m.k+'" data-s="'+s+'">'+s+'</button>'}).join('')+'</div></section>'}).join('');
  $('#burger').addEventListener('click',function(){var v=!mob.classList.contains('v');mob.classList.toggle('v',v);this.setAttribute('aria-expanded',v);this.textContent=v?'Close':'Menu';});
  mob.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;setFilter(b.dataset.k,b.dataset.s);mob.classList.remove('v');$('#burger').textContent='Menu';});

  /* ---------- Lamelles ---------- */
  var track=$('#track');
  function slat(w,clone){var d=document.createElement('div');d.className='sl';d.dataset.i=w.i;d.style.setProperty('--i',w.i);if(clone)d.setAttribute('aria-hidden','true');else{d.tabIndex=0;d.setAttribute('role','button');d.setAttribute('aria-label',w.t);}
    d.innerHTML='<img src="'+w.src[0]+'" alt=""><span class="tag u">'+w.n+'</span>';return d;}
  for(var r=0;r<3;r++)W.forEach(function(w){track.appendChild(slat(w,r>0))});
  var x=0,v=0,half=0,last=performance.now(),hov=null,drag=null;
  function measure(){half=track.scrollWidth/3;}
  addEventListener('resize',measure);
  var sticks=$('#sticks');W.forEach(function(){sticks.appendChild(document.createElement('i'))});var ST=[].slice.call(sticks.children);
  function loop(now){var dt=Math.min(50,now-last)/16.67;last=now;
    if(!drag){var base=hov?0:.35;v+=(base-v)*.05*dt;x-=v*dt;}
    if(half){while(x<-half)x+=half;while(x>0)x-=half;}
    var sk=Math.max(-14,Math.min(14,v*1.1)),sq=1-Math.min(.25,Math.abs(v)*.012);
    track.style.transform='translate3d('+x+'px,0,0) skewX('+(-sk)+'deg) scaleY('+sq+')';
    // repère : l'œuvre au centre de l'écran
    var c=innerWidth/2,best=null,bd=1e9;$$('.sl').forEach(function(s){var b=s.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-c);if(d<bd){bd=d;best=s}});
    if(best){var i=+best.dataset.i;ST.forEach(function(k,j){k.classList.toggle('a',j===i)});$('#sc').textContent=W[i].n;}
    requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
  addEventListener('wheel',function(e){if(anyOpen())return;v+=(e.deltaY+e.deltaX)*.025;},{passive:true});
  track.addEventListener('pointerdown',function(e){drag={x:e.clientX,m:0};track.setPointerCapture&&track.setPointerCapture(e.pointerId);});
  addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x;drag.x=e.clientX;drag.m+=Math.abs(dx);x+=dx;v=-dx;});
  addEventListener('pointerup',function(){if(drag){var m=drag.m;setTimeout(function(){drag=null},0);drag.done=m;}});
  function enter(s){if(hov===s)return;if(hov)hov.classList.remove('a');hov=s;s.classList.add('a');track.classList.add('h');var w=W[s.dataset.i];
    title(w.t);$('#mA').textContent=w.cat+' / '+w.sub;$('#mB').textContent=w.year;$('#mC').textContent=w.n+' of '+p2(W.length);$('#cur').classList.add('img');setTimeout(measure,720);}
  function leaveS(){if(hov)hov.classList.remove('a');hov=null;track.classList.remove('h');$('#cur').classList.remove('img');setFilter(filt&&filt.k,filt&&filt.sub);}
  track.addEventListener('pointerover',function(e){var s=e.target.closest('.sl');if(s&&!drag)enter(s)});
  track.addEventListener('pointerleave',leaveS);
  track.addEventListener('focusin',function(e){var s=e.target.closest('.sl');if(s)enter(s)});
  track.addEventListener('click',function(e){var s=e.target.closest('.sl');if(s&&!(drag&&drag.done>6))openW(s)});
  track.addEventListener('keydown',function(e){if(e.key==='Enter'){var s=e.target.closest('.sl');if(s)openW(s)}});
  var tt=null;function title(t){var el=$('#title');clearTimeout(tt);el.classList.add('out');tt=setTimeout(function(){el.innerHTML='<span>'+t+'</span>';requestAnimationFrame(function(){el.classList.remove('out')})},220);}

  /* ---------- Ouverture ---------- */
  var O1=$('#open'),fly=$('#fly'),curW=null,src=null;
  function anyOpen(){return O1.classList.contains('v')||$('#sheet').classList.contains('v')}
  function openW(s){var w=W[s.dataset.i];curW=w;src=s;var b=s.getBoundingClientRect();
    fly.src=w.src[0];fly.hidden=false;fly.style.transition='none';fly.style.left=b.left+'px';fly.style.top=b.top+'px';fly.style.width=b.width+'px';fly.style.height=b.height+'px';
    $('#letters').innerHTML=w.t.toUpperCase().split('').map(function(ch,k){return '<span style="--k:'+k+'">'+(ch===' '?'&nbsp;':ch)+'</span>'}).join('');
    $('#on').textContent=w.n+' · '+w.cat+' / '+w.sub;
    $('#odl').innerHTML='<span>A</span><dt>Year</dt><dd>'+w.year+'</dd><span>B</span><dt>Type</dt><dd>'+w.sub+'</dd><span>C</span><dt>Role</dt><dd>'+w.role+'</dd><span>D</span><dt>Tools</dt><dd>'+w.tools+'</dd>';
    $('#desc').textContent=w.desc;
    O1.classList.add('v');
    var img=new Image();img.src=w.src[0];var ar=(img.naturalWidth||4)/(img.naturalHeight||3);
    var H=Math.min(innerHeight*.56,(innerWidth*.5)/ar),Wd=H*ar;
    requestAnimationFrame(function(){requestAnimationFrame(function(){fly.style.transition='';fly.style.left=(innerWidth-Wd)/2+'px';fly.style.top=(innerHeight-H)/2+'px';fly.style.width=Wd+'px';fly.style.height=H+'px';O1.classList.add('ready');$('#oclose').focus({preventScroll:true});});});}
  function closeO(){var b=src.getBoundingClientRect();O1.classList.remove('ready');fly.style.left=b.left+'px';fly.style.top=b.top+'px';fly.style.width=b.width+'px';fly.style.height=b.height+'px';
    setTimeout(function(){O1.classList.remove('v')},250);setTimeout(function(){fly.hidden=true},900);}
  $('#oclose').addEventListener('click',closeO);

  /* ---------- Explore ---------- */
  $('#explore').addEventListener('click',function(){var w=curW;$('#sn').textContent=w.n+' · '+w.cat+' / '+w.sub;$('#sh').textContent=w.t;$('#sl').textContent=w.desc;
    $('#stbl').innerHTML='<tr><td>Year</td><td>'+w.year+'</td></tr><tr><td>Type</td><td>'+w.sub+'</td></tr><tr><td>Role</td><td>'+w.role+'</td></tr><tr><td>Tools</td><td>'+w.tools+'</td></tr>';
    $('#simgs').innerHTML=w.src.map(function(s,k){return '<figure><img src="'+s+'" alt=""><figcaption class="u s">'+w.n+'.'+(k+1)+'</figcaption></figure>'}).join('')+(w.real?'':'<div class="todo u">Project images, text and credits to come</div>');
    $('#sheet').scrollTop=0;$('#sheet').classList.add('v');$('#sclose').focus({preventScroll:true});});
  $('#sclose').addEventListener('click',function(){$('#sheet').classList.remove('v')});
  addEventListener('keydown',function(e){if(e.key!=='Escape')return;if($('#sheet').classList.contains('v'))$('#sheet').classList.remove('v');else if(O1.classList.contains('v'))closeO();else hideDrop();});

  /* Curseur */
  var cu=$('#cur');addEventListener('pointermove',function(e){cu.classList.add('v');cu.style.transform='translate3d('+e.clientX+'px,'+e.clientY+'px,0)'});
})();
</script>
