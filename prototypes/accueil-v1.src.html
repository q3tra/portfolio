<title>Prototype theoooo.studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Host+Grotesk:wght@300;400;500&display=swap">
<style>
/* Prototype d'accueil plein écran. Intro (le signe devient le nom) → le nom part en logo → une fente d'images s'ouvre en bande qui dérive. Deux vues : Index (bande) et List (titres, grande image, rail). */
:root{
  color-scheme:dark;
  --ink:#060708;
  --flash:#eeefed;
  --steel:#6f767c;
  --dim:#3a3f44;
  --line:#1b1f22;
  --grot:"Host Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Fragment Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.7,0,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--flash);font-family:var(--mono);font-size:11px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.u{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.s{color:var(--steel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:1px solid var(--flash);outline-offset:3px}
#app{position:relative;height:100%;max-width:1680px;margin:0 auto}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;z-index:20;background:var(--ink);display:grid;place-items:center;transition:background .6s}
#intro.gone{background:transparent;pointer-events:none}
#wm{width:min(70vw,760px);height:auto;overflow:visible;transform-origin:0 0;transition:transform 1.1s var(--ease),opacity .4s}
#wm text{font-family:var(--grot);font-weight:400;fill:var(--flash)}
#load{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:min(60vw,560px);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;transition:opacity .4s}
#load i{display:block;height:1px;background:var(--dim);position:relative;overflow:hidden}
#load i::after{content:"";position:absolute;inset:0;background:var(--flash);transform-origin:0 50%;transform:scaleX(var(--p,0))}
#skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));transition:opacity .4s}

/* ---------- Cadre ---------- */
header{position:absolute;inset:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start;padding-top:calc(18px + env(safe-area-inset-top,0px));z-index:5;opacity:0;transition:opacity .8s .3s}
.on header,.on .foot{opacity:1}
#logo{display:flex;gap:9px;align-items:center;color:var(--flash);text-decoration:none}
#logo svg{width:15px;height:15px;flex:none}
#logo span{font-family:var(--grot);font-size:15px;letter-spacing:-.02em}
#now{text-align:center;display:grid;gap:2px}
#now b{font-weight:400;color:var(--flash)}
nav{justify-self:end;display:grid;grid-template-columns:auto auto;gap:3px 12px}
nav button{display:contents}
nav button .n{color:var(--dim);text-align:right;transition:color .3s}
nav button .t{color:var(--steel);transition:color .3s;position:relative}
nav button:hover .t,nav button[aria-current] .t{color:var(--flash)}
nav button:hover .n,nav button[aria-current] .n{color:var(--steel)}
nav button[aria-current] .t::after{content:" ·"}
#hint{position:absolute;right:0;top:calc(112px + env(safe-area-inset-top,0px));max-width:26ch;text-align:right;color:var(--steel);opacity:0;transform:translateY(-4px);transition:opacity .3s,transform .3s;z-index:5}
#hint.v{opacity:1;transform:none}

.foot{position:absolute;inset:auto 0 0;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:end;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;opacity:0;transition:opacity .8s .5s}
#frag{max-width:44ch;min-height:4.4em;display:grid;gap:4px;align-content:end}
#frag q{quotes:none;color:var(--flash)}
#frag .cur{display:inline-block;width:.55em;height:1em;vertical-align:-2px;background:var(--flash);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#count{text-align:center}
#views{justify-self:end;display:flex;gap:16px}
#views button{color:var(--steel)}
#views button[aria-pressed="true"]{color:var(--flash)}
#views button::before{content:"[   ] ";white-space:pre}
#views button[aria-pressed="true"]::before{content:"[ · ] "}

/* ---------- Index : la bande ---------- */
#index{position:absolute;inset:0;display:grid;align-items:center;overflow:hidden;z-index:1}
#index[hidden]{display:none}
#strip{height:190px;display:flex;align-items:center;transform:scaleY(.012);opacity:0;transition:transform 1.2s var(--ease),opacity .3s}
.open #strip{transform:none;opacity:1}
#track{display:flex;align-items:center;gap:clamp(28px,4vw,64px);will-change:transform;padding-inline:20px}
#track figure{margin:0;flex:none;position:relative;cursor:none;transition:opacity .5s,filter .5s}
#track img{display:block;height:var(--h);width:auto;transition:transform .7s var(--ease);clip-path:inset(50% 0 50% 0);transition:transform .7s var(--ease),clip-path 1s var(--ease)}
.open #track img{clip-path:inset(0 0 0 0);transition-delay:0s,calc(var(--i) * 45ms + .5s)}
#track figure .k{position:absolute;left:0;top:calc(100% + 8px);white-space:nowrap;opacity:0;transition:opacity .3s}
#track.h figure{opacity:.18;filter:grayscale(1)}
#track.h figure.a{opacity:1;filter:none}
#track figure.a img{transform:scale(1.55)}
#track figure.a .k{opacity:1;transform:translateY(calc(var(--h) * .28))}

/* ---------- List ---------- */
#list{position:absolute;inset:0;display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2.4fr) 64px;gap:clamp(16px,3vw,48px);align-items:center;padding-block:120px 110px;z-index:1}
#list[hidden]{display:none}
#titles{list-style:none;margin:0;padding:0;display:grid;gap:1px;align-self:center;max-height:100%;overflow:auto;scrollbar-width:none}
#titles button{color:var(--dim);transition:color .25s,padding .35s var(--ease);display:flex;gap:10px;width:100%}
#titles button span{color:inherit}
#titles button:hover{color:var(--steel)}
#titles button[aria-current]{color:var(--flash);padding-left:14px}
#big{margin:0;height:100%;display:grid;place-items:center;position:relative;min-width:0}
#big img{max-height:100%;max-width:100%;display:block;object-fit:contain;clip-path:inset(0);transition:clip-path .9s var(--ease)}
#big img.out{clip-path:inset(50% 0 50% 0)}
#big figcaption{position:absolute;left:0;bottom:-28px}
#rail{display:grid;gap:6px;align-self:center;max-height:100%;overflow:auto;scrollbar-width:none;justify-items:end}
#rail img{width:34px;height:auto;display:block;opacity:.35;transition:opacity .25s,width .35s var(--ease);cursor:pointer}
#rail img.a{opacity:1;width:52px}

/* ---------- Visionneuse ---------- */
#viewer{position:fixed;inset:0;z-index:30;background:var(--ink);display:grid;grid-template-rows:auto 1fr auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .4s}
#viewer.v{opacity:1;pointer-events:auto}
#viewer .top,#viewer .bot{display:flex;justify-content:space-between;gap:16px}
#viewer figure{margin:0;display:grid;place-items:center;min-height:0;padding-block:24px}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;clip-path:inset(50% 0 50% 0);transition:clip-path 1.1s var(--ease)}
#viewer.v img.in{clip-path:inset(0)}

/* ---------- Curseur : la mire ---------- */
#cur{position:fixed;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;pointer-events:none;z-index:40;color:var(--flash);mix-blend-mode:difference;transition:width .3s,height .3s,margin .3s}
#cur svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s,transform .5s var(--ease)}
#cur .p{opacity:0;transform:rotate(-45deg)}
#cur.img .m{opacity:0;transform:rotate(45deg)}
#cur.img .p{opacity:1;transform:none}
@media (pointer:fine){ body,button,#track figure{cursor:none} }
@media (pointer:coarse){ #cur{display:none} }

@media (max-width:760px){
  header{grid-template-columns:1fr;row-gap:12px}
  #now{display:none}
  nav{grid-column:1/-1;justify-self:start;display:flex;flex-wrap:wrap;gap:4px 14px}
  nav button .n{display:none}
  #hint{display:none}
  .foot{grid-template-columns:1fr auto}
  #count{display:none}
  #frag{max-width:30ch;font-size:10px}
  #strip{height:150px}
  #list{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding-block:96px 120px}
  #titles{grid-auto-flow:column;grid-auto-columns:max-content;gap:14px;overflow-x:auto}
  #titles button[aria-current]{padding-left:0}
  #rail{display:none}
}
@media (prefers-reduced-motion:reduce){
  #strip,#track img,#big img,#viewer img,#wm{transition:none!important}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="arm-b"><line x1="16" y1="4" x2="16" y2="4" stroke="currentColor" stroke-linecap="round" stroke-width="5.4">
      <animate attributeName="y1" values="4;4;1.6;1.6;4" keyTimes="0;.32;.5;.82;1" dur="4.8s" repeatCount="indefinite" calcMode="spline" keySplines=".7 0 .2 1;.7 0 .2 1;.7 0 .2 1;.7 0 .2 1"/>
      <animate attributeName="y2" values="4;4;12.4;12.4;4" keyTimes="0;.32;.5;.82;1" dur="4.8s" repeatCount="indefinite" calcMode="spline" keySplines=".7 0 .2 1;.7 0 .2 1;.7 0 .2 1;.7 0 .2 1"/>
      <animate attributeName="stroke-width" values="5.4;5.4;1.6;1.6;5.4" keyTimes="0;.32;.5;.82;1" dur="4.8s" repeatCount="indefinite" calcMode="spline" keySplines=".7 0 .2 1;.7 0 .2 1;.7 0 .2 1;.7 0 .2 1"/>
    </line></g>
    <g id="sign-b"><use href="#arm-b"/><use href="#arm-b" transform="rotate(90 16 16)"/><use href="#arm-b" transform="rotate(180 16 16)"/><use href="#arm-b" transform="rotate(270 16 16)"/></g>
  </defs>
</svg>

<div id="app">
  <div id="intro">
    <svg id="wm" viewBox="-60 -110 820 150" role="img" aria-label="theoooo.studio">
      <g stroke="currentColor" stroke-linecap="round" fill="none" style="color:var(--flash)"><line id="aT"/><line id="aB"/><line id="aL"/><line id="aR"/></g>
      <g fill="none" stroke="currentColor" style="color:var(--flash)"><circle id="d0"/><circle id="d1"/><circle id="d2"/><circle id="d3"/></g>
      <text id="he" x="44" y="0" font-size="100" letter-spacing="-4">he</text>
      <text id="st" x="394" y="0" font-size="100" letter-spacing="-4">.studio</text>
    </svg>
    <div id="load" class="u s"><span>theoooo.studio</span><i></i><span id="pct">000</span></div>
    <button id="skip" type="button" class="u s">Skip</button>
  </div>

  <header>
    <a id="logo" href="#" aria-label="theoooo.studio, retour au début"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#sign-b"/></svg><span id="logotxt">theoooo.studio</span></a>
    <div id="now" class="u s"><span><b id="clock">--:--:--</b> Paris</span><span id="where">Index · 20 works</span></div>
    <nav aria-label="Sommaire">
      <button type="button" data-v="index" data-h="Every work, in one line. Hover to look closer." aria-current="true"><span class="n u">I</span><span class="t u">Index</span></button>
      <button type="button" data-v="list" data-h="The same works, one at a time, with their titles."><span class="n u">II</span><span class="t u">Archive</span></button>
      <button type="button" data-h="Pieces from rien. Prints. Editions. Few, numbered."><span class="n u">III</span><span class="t u">Objects</span></button>
      <button type="button" data-h="Texts kept along the way: quotes, notes, short essays."><span class="n u">IV</span><span class="t u">Fragments</span></button>
      <button type="button" data-h="One address. Answers within a few days."><span class="n u">V</span><span class="t u">Correspondence</span></button>
    </nav>
  </header>
  <p id="hint" class="u"></p>

  <section id="index" aria-label="Index">
    <div id="strip"><div id="track"></div></div>
  </section>

  <section id="list" aria-label="Archive" hidden>
    <ol id="titles"></ol>
    <figure id="big"><img alt=""><figcaption class="u s"></figcaption></figure>
    <div id="rail"></div>
  </section>

  <div class="foot">
    <div id="frag" class="u s" aria-live="off"><span><q id="fq"></q><span class="cur"></span></span><span id="fa"></span></div>
    <div id="count" class="u s">— / 020</div>
    <div id="views" role="group" aria-label="Vue"><button type="button" class="u" data-v="index" aria-pressed="true">Index</button><button type="button" class="u" data-v="list" aria-pressed="false">List</button></div>
  </div>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="Œuvre">
    <div class="top u"><span id="vt"></span><button type="button" id="vclose" class="u">Close</button></div>
    <figure><img id="vimg" alt=""></figure>
    <div class="bot u s"><button type="button" id="vprev" class="u">Prev</button><span id="vn"></span><button type="button" id="vnext" class="u">Next</button></div>
  </div>

  <div id="cur" aria-hidden="true">
    <svg class="m" viewBox="0 0 32 32"><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M16 2v9M16 21v9M2 16h9M21 16h9"/></g></svg>
    <svg class="p" viewBox="0 0 32 32"><g fill="currentColor"><circle cx="16" cy="5" r="2.4"/><circle cx="27" cy="16" r="2.4"/><circle cx="16" cy="27" r="2.4"/><circle cx="5" cy="16" r="2.4"/></g></svg>
  </div>
</div>

<script>
var IMGS = __IMGS__;
(function(){
  var $=function(s){return document.querySelector(s)}, app=$('#app');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var KINDS=['Image','Garment','Space','Image','Film','Object','Image','Space','Garment','Image'];
  var W=IMGS.map(function(src,i){return {src:src,n:String(i+1).padStart(3,'0'),title:'Untitled, '+String(i+1).padStart(2,'0'),kind:KINDS[i%KINDS.length],year:2026-(i%4)}});
  var pad=function(n){return String(n).padStart(3,'0')};

  /* ---- Intro : le signe devient le nom (même dessin que la planche 03) ---- */
  var C={x:20,y:-36},R=34,O=[181,241,301,361];
  var g=function(id){return document.getElementById(id)};
  var arms={T:g('aT'),B:g('aB'),L:g('aL'),R:g('aR')},dots=[0,1,2,3].map(function(i){return g('d'+i)}),he=g('he'),st=g('st');
  var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},lerp=function(a,b,t){return a+(b-a)*t},seg=function(t,a,b){return Math.min(1,Math.max(0,(t-a)/(b-a)))};
  var MIRE={T:[20,-72,20,-48],B:[20,-24,20,0],L:[-16,-36,8,-36],R:[32,-36,56,-36]},TEE={T:[20,-74,20,-36],B:[20,-36,20,0],L:[2,-52,20,-52],R:[20,-52,40,-52]};
  function frame(s){
    var rot=ease(seg(s,.9,1.9)),go=ease(seg(s,1.9,3)),tee=ease(seg(s,3,3.9)),nm=ease(seg(s,3.9,4.8));
    dots.forEach(function(d,i){var a=(i*90-90+rot*90)*Math.PI/180;d.setAttribute('cx',lerp(C.x+R*Math.cos(a),O[i],go));d.setAttribute('cy',lerp(C.y+R*Math.sin(a),-26,go));d.setAttribute('r',lerp(3.2,23.6,tee));d.setAttribute('stroke-width',lerp(6.4,9,tee));});
    var w=lerp(4,9,tee);
    ['T','B','L','R'].forEach(function(n){var m=MIRE[n],e=arms[n],p=[0,1,2,3].map(function(k){var c=k%2?C.y:C.x;return lerp(lerp(c,m[k],go),TEE[n][k],tee)});e.setAttribute('x1',p[0]);e.setAttribute('y1',p[1]);e.setAttribute('x2',p[2]);e.setAttribute('y2',p[3]);e.setAttribute('stroke-width',go>0?w:0);});
    he.setAttribute('opacity',nm);he.setAttribute('transform','translate('+lerp(-14,0,nm)+',0)');
    var sn=ease(seg(s,4.3,5.1));st.setAttribute('opacity',sn);st.setAttribute('transform','translate('+lerp(-18,0,sn)+',0)');
    var p=Math.min(1,s/5.2);$('#load').style.setProperty('--p',p);$('#pct').textContent=pad(Math.round(p*100));
  }
  var t0=null,done=false;
  function tick(now){if(done)return;if(t0===null)t0=now;var s=(now-t0)/1000;frame(Math.min(s,5.2));if(s<5.9)requestAnimationFrame(tick);else leave();}
  function leave(){
    if(done)return;done=true;frame(5.2);
    // Le nom rejoint la place du logo, puis la fente s'ouvre.
    var a=$('#wm').getBoundingClientRect(),b=$('#logotxt').getBoundingClientRect();
    var sc=b.width/(a.width*0.82);  // .studio + he + oooo occupent ~82 % de la largeur du dessin
    $('#wm').style.transform='translate('+(b.left-a.left-a.width*0.09*sc)+'px,'+(b.top-a.top-a.height*0.42*sc)+'px) scale('+sc+')';
    $('#load').style.opacity=0;$('#skip').style.opacity=0;
    app.classList.add('on');
    setTimeout(function(){$('#intro').classList.add('gone');$('#wm').style.opacity=0;},900);
    setTimeout(function(){app.classList.add('open');},1000);
    setTimeout(function(){$('#intro').remove();},2200);
  }
  $('#skip').addEventListener('click',leave);$('#intro').addEventListener('click',leave);
  if(reduce){frame(5.2);setTimeout(leave,600);}else requestAnimationFrame(tick);

  /* ---- Index : la bande qui dérive ---- */
  var track=$('#track'),H=[132,98,156,112,140,90,124,104,148,96];
  function fig(w,i,clone){var f=document.createElement('figure');f.style.setProperty('--h',H[i%H.length]+'px');f.style.setProperty('--i',i);f.style.transform='translateY('+[0,-38,22,-12,30,-26,8,40,-34,14][i%10]+'px)';f.dataset.i=i;if(clone)f.setAttribute('aria-hidden','true');
    f.innerHTML='<img src="'+w.src+'" alt=""><figcaption class="k u"><span style="color:var(--flash)">'+w.n+'</span> '+w.title+' · '+w.kind+' · '+w.year+'</figcaption>';return f;}
  W.forEach(function(w,i){track.appendChild(fig(w,i))});W.forEach(function(w,i){track.appendChild(fig(w,i,true))});
  var x=0,v=0,target=.42,half=0,last=performance.now(),hov=null;
  function measure(){half=track.scrollWidth/2;}
  addEventListener('resize',measure);setTimeout(measure,300);
  function loop(now){var dt=Math.min(50,now-last)/16.67;last=now;
    var base=hov?0.04:target;v+= (base-v)*0.06*dt;x-=v*dt;
    if(half){if(x<-half)x+=half;if(x>0)x-=half;}
    track.style.transform='translate3d('+x+'px,0,0)';requestAnimationFrame(loop);}
  if(!reduce)requestAnimationFrame(loop);
  addEventListener('wheel',function(e){if($('#index').hidden||$('#viewer').classList.contains('v'))return;v+= (e.deltaY+e.deltaX)*0.02;},{passive:true});
  var drag=null;
  track.addEventListener('pointerdown',function(e){drag={x:e.clientX,moved:0};});
  addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x;drag.x=e.clientX;drag.moved+=Math.abs(dx);x+=dx;v=-dx*.5;});
  addEventListener('pointerup',function(){setTimeout(function(){drag=null},0)});
  track.addEventListener('pointerover',function(e){var f=e.target.closest('figure');if(!f)return;if(hov)hov.classList.remove('a');hov=f;f.classList.add('a');track.classList.add('h');$('#count').textContent=W[f.dataset.i].n+' / '+pad(W.length);$('#cur').classList.add('img');});
  track.addEventListener('pointerout',function(e){var f=e.target.closest('figure');if(!f||f.contains(e.relatedTarget))return;f.classList.remove('a');hov=null;track.classList.remove('h');$('#count').textContent='— / '+pad(W.length);$('#cur').classList.remove('img');});
  track.addEventListener('click',function(e){var f=e.target.closest('figure');if(f&&(!drag||drag.moved<6))openV(+f.dataset.i);});

  /* ---- List ---- */
  var titles=$('#titles'),rail=$('#rail'),big=$('#big img'),cap=$('#big figcaption'),cur=0;
  W.forEach(function(w,i){var li=document.createElement('li');li.innerHTML='<button type="button" class="u" data-i="'+i+'"><span>'+w.n+'</span><span>'+w.title+'</span></button>';titles.appendChild(li);
    var r=document.createElement('img');r.src=w.src;r.alt='';r.dataset.i=i;rail.appendChild(r);});
  function pick(i,instant){cur=i;titles.querySelectorAll('button').forEach(function(b){b.toggleAttribute('aria-current',+b.dataset.i===i)});rail.querySelectorAll('img').forEach(function(r){r.classList.toggle('a',+r.dataset.i===i)});
    var w=W[i];cap.textContent=w.n+' · '+w.title+' · '+w.kind+' · '+w.year;$('#count').textContent=w.n+' / '+pad(W.length);
    if(instant||reduce){big.src=w.src;return;}big.classList.add('out');setTimeout(function(){big.src=w.src;big.onload=function(){big.classList.remove('out')};},450);}
  titles.addEventListener('mouseover',function(e){var b=e.target.closest('button');if(b&&+b.dataset.i!==cur)pick(+b.dataset.i)});
  titles.addEventListener('click',function(e){var b=e.target.closest('button');if(b)openV(+b.dataset.i)});
  rail.addEventListener('click',function(e){var r=e.target.closest('img');if(r)pick(+r.dataset.i)});
  big.addEventListener('click',function(){openV(cur)});
  big.addEventListener('mouseenter',function(){$('#cur').classList.add('img')});big.addEventListener('mouseleave',function(){$('#cur').classList.remove('img')});
  pick(0,true);

  /* ---- Vues et sommaire ---- */
  function view(v){$('#index').hidden=v!=='index';$('#list').hidden=v!=='list';
    document.querySelectorAll('#views button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===v)});
    document.querySelectorAll('nav button').forEach(function(b){b.toggleAttribute('aria-current',b.dataset.v===v)});
    $('#where').textContent=(v==='index'?'Index':'Archive')+' · '+W.length+' works';
    if(v==='index'){app.classList.remove('open');requestAnimationFrame(function(){requestAnimationFrame(function(){app.classList.add('open');measure();})});}
    else pick(cur,true);}
  document.querySelectorAll('#views button').forEach(function(b){b.addEventListener('click',function(){view(b.dataset.v)})});
  var hint=$('#hint');
  document.querySelectorAll('nav button').forEach(function(b){
    b.addEventListener('mouseenter',function(){hint.textContent=b.dataset.h;hint.classList.add('v')});
    b.addEventListener('mouseleave',function(){hint.classList.remove('v')});
    b.addEventListener('click',function(){if(b.dataset.v)view(b.dataset.v);else{hint.textContent=b.dataset.h+'  —  page à venir';hint.classList.add('v');}});
  });
  $('#logo').addEventListener('click',function(e){e.preventDefault();view('index')});

  /* ---- Visionneuse ---- */
  var V=$('#viewer'),vi=$('#vimg'),vc=0;
  function show(i){vc=(i+W.length)%W.length;var w=W[vc];vi.classList.remove('in');vi.src=w.src;$('#vt').textContent=w.n+' · '+w.title;$('#vn').textContent=w.kind+' · '+w.year;
    requestAnimationFrame(function(){requestAnimationFrame(function(){vi.classList.add('in')})});}
  function openV(i){V.classList.add('v');show(i);$('#vclose').focus({preventScroll:true});}
  function closeV(){V.classList.remove('v');}
  $('#vclose').addEventListener('click',closeV);$('#vnext').addEventListener('click',function(){show(vc+1)});$('#vprev').addEventListener('click',function(){show(vc-1)});
  addEventListener('keydown',function(e){if(!V.classList.contains('v'))return;if(e.key==='Escape')closeV();if(e.key==='ArrowRight')show(vc+1);if(e.key==='ArrowLeft')show(vc-1);});

  /* ---- Fragments : tapés lettre à lettre (exemples, à remplacer par tes auteurs) ---- */
  var F=[["Life can only be understood backwards; but it must be lived forwards.","Søren Kierkegaard · Journals · 1843"],["Au milieu de l'hiver, j'apprenais enfin qu'il y avait en moi un été invincible.","Albert Camus · Retour à Tipasa · 1952"]];
  var fi=0;function type(){var q=F[fi][0],k=0;$('#fa').textContent='';(function step(){$('#fq').textContent=q.slice(0,k);if(k++<q.length)setTimeout(step,reduce?0:38);else{$('#fa').textContent='— '+F[fi][1];setTimeout(function(){fi=(fi+1)%F.length;type();},9000);}})();}
  setTimeout(type,reduce?0:6500);

  /* ---- Horloge et curseur ---- */
  function clk(){try{$('#clock').textContent=new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Europe/Paris'}).format(new Date());}catch(e){}}
  clk();setInterval(clk,1000);
  var cu=$('#cur');addEventListener('pointermove',function(e){cu.style.transform='translate3d('+e.clientX+'px,'+e.clientY+'px,0)'});
})();
</script>
