<title>Prototype theoooo.studio v4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Host+Grotesk:wght@300;400;500&display=swap">
<style>
/* v4 : les lamelles passent en WebGL (courbure et couleur qui reviennent avec la vitesse, léger décalage RVB), ruban infini bord à bord. v3 : bloc serré (logo juste au-dessus des lamelles, titre juste en dessous), menu qui se déplie en ligne, chargement réduit à l'animation. Base v2 : menu à rubriques (logique Norm), lamelles qui se déforment à la vitesse (logique Aristide Benoist), ouverture plein écran puis Explore (fiche à la Rauno). Chargement : le signe devient le nom + règle graduée et compteur géant. */
:root{
  color-scheme:dark;
  --H:min(52vh,480px);  /* hauteur des lamelles : tout le bloc se cale dessus */
  --ink:#060708;
  --panel:#0c0e0f;
  --flash:#eeefed;
  --steel:#737a80;
  --dim:#30353a;
  --line:#1a1e21;
  --grot:"Host Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Fragment Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.7,0,.2,1);
  --out:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--flash);font-family:var(--mono);font-size:11px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.u{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.s{color:var(--steel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible{outline:1px solid var(--flash);outline-offset:3px}
#app{position:relative;height:100%;max-width:1720px;margin:0 auto}

/* ---------- Chargement ---------- */
#intro{position:fixed;inset:0;z-index:50;background:var(--ink);transition:opacity .7s}
#intro.gone{opacity:0;pointer-events:none}
#wm{position:absolute;left:50%;top:44%;width:min(66vw,720px);height:auto;overflow:visible;transform:translate(-50%,-50%);transform-origin:0 0;transition:transform 1.1s var(--ease)}
#wm text{font-family:var(--grot);font-weight:400;fill:var(--flash)}
#skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px))}

/* ---------- En-tête ---------- */
header{position:absolute;left:0;right:0;top:calc(50% - var(--H) / 2 - 92px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;z-index:20;opacity:0;transition:opacity .8s .2s}
.on header,.on .low{opacity:1}
#logo{display:flex;gap:12px;align-items:center;color:var(--flash);text-decoration:none}
#logo svg{width:30px;height:30px;flex:none}
#logo span{font-family:var(--grot);font-size:clamp(26px,2.6vw,40px);letter-spacing:-.035em;line-height:1}
#menu{display:flex;gap:clamp(18px,2.4vw,40px)}
#burger{display:none}

/* Menu : survoler une rubrique fait s'effacer les autres et déplie ses sous-rubriques en ligne, lettres décodées ; les lamelles se filtrent en aperçu. */
.grp{position:relative;white-space:nowrap}
.grp .cat{color:var(--steel);transition:color .3s;padding-block:8px}
#menu.x .grp:not(.open) .cat{color:var(--dim)}
.grp.open .cat,.grp .cat.cur{color:var(--flash)}
/* Les sous-rubriques sortent sous la rubrique, sans rien déplacer : la souris ne perd jamais sa cible. */
.subs{position:absolute;top:100%;right:0;padding-top:10px;display:flex;gap:18px;clip-path:inset(0 0 0 100%);transition:clip-path .6s var(--ease);pointer-events:none}
.grp.open .subs{clip-path:inset(0);pointer-events:auto}
.subs button{color:var(--steel);transition:color .2s}
.subs button:hover,.subs button.cur{color:var(--flash)}
.subs sup{color:var(--dim);font-size:9px;margin-left:3px}


/* ---------- Lamelles ---------- */
#stage{position:absolute;inset:0;display:grid;align-items:center;overflow:hidden;z-index:1}
#track{display:flex;align-items:center;gap:10px;will-change:transform;height:var(--H);opacity:0;transition:opacity .6s}
.open #track{opacity:1}
.sl{flex:none;width:58px;height:100%;position:relative;overflow:hidden;cursor:pointer;transition:width .7s var(--ease),opacity .5s,filter .5s;clip-path:inset(50% 0 50% 0)}
.open .sl{clip-path:inset(0);transition:width .7s var(--ease),opacity .5s,filter .5s,clip-path 1s var(--ease) calc(var(--i) * 28ms)}
.sl img{position:absolute;left:50%;top:0;height:100%;width:auto;min-width:100%;object-fit:cover;transform:translateX(-50%);filter:grayscale(1) brightness(.85);transition:filter .5s}
.sl.a{width:clamp(220px,22vw,360px)}
.sl.a img{filter:none}
.sl.off{opacity:.12;pointer-events:none}
#track.h .sl:not(.a){filter:brightness(.55)}
.sl .tag{position:absolute;left:6px;bottom:6px;font-size:9.5px;letter-spacing:.1em;color:var(--flash);mix-blend-mode:difference}

#gl{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:none;touch-action:pan-y}
.gl #gl{display:block}
.gl #stage{display:none}
/* ---------- Bas d'écran ---------- */
.low{position:absolute;left:0;right:0;top:calc(50% + var(--H) / 2 + 20px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start;z-index:5;opacity:0;transition:opacity .8s .5s;pointer-events:none}
#title{margin:0;font-family:var(--grot);font-weight:300;font-size:clamp(34px,4.4vw,68px);letter-spacing:-.045em;line-height:.95;min-height:1em;overflow:hidden}
#title span{display:inline-block;transition:transform .55s var(--ease),opacity .4s}
#title.out span{transform:translateY(105%);opacity:0}
#meta{margin:0;display:flex;gap:22px;justify-self:end;color:var(--steel);padding-top:8px}
#meta span:empty{display:none}

/* ---------- Ouverture d'une œuvre ---------- */
#open{position:fixed;inset:0;z-index:30;background:var(--ink);opacity:0;pointer-events:none;transition:opacity .45s}
#open.v{opacity:1;pointer-events:auto}
#fly{position:fixed;object-fit:cover;z-index:32;transition:left .9s var(--ease),top .9s var(--ease),width .9s var(--ease),height .9s var(--ease);pointer-events:none}
#letters{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;padding-inline:max(16px,env(safe-area-inset-left,0px));font-family:var(--grot);font-weight:400;font-size:clamp(70px,13vw,210px);letter-spacing:-.04em;line-height:1;z-index:31;pointer-events:none;mix-blend-mode:difference}
#letters span{display:inline-block;transform:translateY(40%);opacity:0;transition:transform .9s var(--out),opacity .6s}
#open.ready #letters span{transform:none;opacity:1;transition-delay:calc(var(--k) * 40ms + .35s)}
#open .bar{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));z-index:33}
#open .foot{position:absolute;inset:auto 0 0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:24px;align-items:end;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:33;opacity:0;transition:opacity .5s .7s}
#open.ready .foot{opacity:1}
#open dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0}
#open dl dt{color:var(--steel)}
#open dl dd{margin:0}
#explore{display:grid;justify-items:center;gap:10px}
#explore::after{content:"";width:1px;height:46px;background:var(--flash);transform-origin:top;animation:drip 1.8s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#desc{margin:0;justify-self:end;text-align:right;max-width:36ch;color:var(--steel);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* ---------- Explore : la fiche ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:var(--ink);overflow:auto;transform:translateY(100%);transition:transform .9s var(--ease);padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
#sheet.v{transform:none}
#sheet .bar{display:flex;justify-content:space-between;position:sticky;top:0;padding-bottom:16px;background:var(--ink);z-index:2}
#sheet .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,5vw,80px);margin-top:8vh}
#sheet aside{position:sticky;top:60px;align-self:start;display:grid;gap:28px}
#sheet h2{margin:0;font-family:var(--grot);font-weight:300;font-size:clamp(40px,5vw,80px);letter-spacing:-.05em;line-height:.9}
#sheet .lede{margin:0;font-family:var(--grot);font-weight:300;font-size:18px;line-height:1.4;max-width:34ch;color:#cfd2d4}
#sheet table{border-collapse:collapse;width:100%}
#sheet td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
#sheet td:first-child{color:var(--steel);width:9ch}
#sheet .imgs{display:grid;gap:clamp(24px,6vh,80px)}
#sheet figure{margin:0;display:grid;gap:8px}
#sheet figure img{width:100%;height:auto;display:block}
#sheet .todo{border:1px dashed var(--dim);padding:40px;color:var(--steel);text-align:center}

/* ---------- Menu téléphone ---------- */
#mob{position:fixed;inset:0;z-index:45;background:var(--ink);padding:calc(80px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));overflow:auto;clip-path:inset(0 0 100% 0);transition:clip-path .6s var(--ease)}
#mob.v{clip-path:inset(0)}
#mob section{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:8px}
#mob h4{margin:0;font-family:var(--grot);font-weight:300;font-size:38px;letter-spacing:-.04em;line-height:1}
#mob .subs{display:flex;flex-wrap:wrap;gap:4px 14px}

@media (pointer:fine){ .sl{cursor:none} }
#cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;z-index:60;color:var(--flash);mix-blend-mode:difference;opacity:0;transition:opacity .2s}
#cur.v{opacity:1}
#cur svg{position:absolute;inset:0;width:100%;height:100%;transition:opacity .3s,transform .5s var(--ease)}
#cur .p{opacity:0;transform:rotate(-45deg)}
#cur.img .m{opacity:0;transform:rotate(45deg)}
#cur.img .p{opacity:1;transform:none}
@media (pointer:coarse){#cur{display:none}}

@media (max-width:820px){
  #menu{display:none}
  #burger{display:block}
  .low{grid-template-columns:minmax(0,1fr)}
  #meta{display:none}
  .sl{width:40px}
  .sl.a{width:190px}
  #open .foot{grid-template-columns:minmax(0,1fr);justify-items:start}
  #desc{justify-self:start;text-align:left}
  #sheet .grid{grid-template-columns:minmax(0,1fr)}
  #sheet aside{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>

      <animate attributeName="y2" values="4;4;12.4;12.4;4" keyTimes="0;.32;.5;.82;1" dur="4.8s" repeatCount="indefinite" calcMode="spline" keySplines=".7 0 .2 1;.7 0 .2 1;.7 0 .2 1;.7 0 .2 1"/>
      <animate attributeName="stroke-width" values="5.4;5.4;1.6;1.6;5.4" keyTimes="0;.32;.5;.82;1" dur="4.8s" repeatCount="indefinite" calcMode="spline" keySplines=".7 0 .2 1;.7 0 .2 1;.7 0 .2 1;.7 0 .2 1"/>

    <svg class="p" viewBox="0 0 32 32"><g fill="currentColor"><circle cx="16" cy="5" r="2.4"/><circle cx="27" cy="16" r="2.4"/><circle cx="16" cy="27" r="2.4"/><circle cx="5" cy="16" r="2.4"/></g></svg>
  </div>
</div>

<script>
var IMGS = __IMGS__;
(function(){
  var $=function(s){return document.querySelector(s)}, $$=function(s){return [].slice.call(document.querySelectorAll(s))}, app=$('#app');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var p2=function(n){return String(n).padStart(2,'0')};

  /* Rubriques : la logique du menu de Norm, avec tes catégories. LIBRARY prend la place d'Architecture. */
  var MENU=[
    {k:'Design',d:'Websites, products and identities.',subs:['Websites','Product','Identity']},
    {k:'Creative',d:'Art direction, photography, posts.',subs:['Art direction','Photography','Posts']},
    {k:'Video',d:'Films, motion, edits.',subs:['Films','Motion','Edits']},
    {k:'Library',d:'What I read, watch, listen to. Runways I keep.',subs:['Books','Films','Music','Runways']},
    {k:'Studio',d:'Who, with what, and how to reach.',subs:['About','Stack','Contact']},
    {k:'Press',d:'Articles and mentions.',subs:['Articles','Interviews']}
  ];
  /* Œuvres : la première est réelle (Who Owns The Grid), les autres sont des emplacements avec des images du mood board. */
  var CATS=[['Creative','Photography'],['Video','Films'],['Library','Runways'],['Creative','Art direction'],['Design','Product'],['Library','Books'],['Video','Motion'],['Creative','Posts'],['Library','Films'],['Design','Identity'],['Library','Music']];
  var W=IMGS.slice(2).map(function(src,i){var c=CATS[i%CATS.length];return {src:[src],t:'Untitled '+p2(i+2),cat:c[0],sub:c[1],year:2026-(i%3),role:'—',tools:'—',desc:'Placeholder. Image from the mood board, to be replaced by your work.',real:false}});
  W.unshift({src:[IMGS[0],IMGS[1]],t:'Who Owns The Grid',cat:'Design',sub:'Websites',year:2026,role:'Design, development, art direction',tools:'Shopify, Liquid, PHP, Stripe',desc:'A studio selling Shopify themes to clothing brands. Identity, site, themes, checkout.',real:true});
  W.forEach(function(w,i){w.i=i;w.n=p2(i+1)});

  /* ---------- Chargement ---------- */
  var C={x:20,y:-36},R=34,O=[181,241,301,361];
  var g=function(id){return document.getElementById(id)};
  var arms={T:g('aT'),B:g('aB'),L:g('aL'),R:g('aR')},dots=[0,1,2,3].map(function(i){return g('d'+i)}),he=g('he'),st=g('st');
  var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},lerp=function(a,b,t){return a+(b-a)*t},seg=function(t,a,b){return Math.min(1,Math.max(0,(t-a)/(b-a)))};
  var MIRE={T:[20,-72,20,-48],B:[20,-24,20,0],L:[-16,-36,8,-36],R:[32,-36,56,-36]},TEE={T:[20,-74,20,-36],B:[20,-36,20,0],L:[2,-52,20,-52],R:[20,-52,40,-52]};

    var w=lerp(4,9,tee);
    ['T','B','L','R'].forEach(function(n){var m=MIRE[n],e=arms[n],p=[0,1,2,3].map(function(k){var c=k%2?C.y:C.x;return lerp(lerp(c,m[k],go),TEE[n][k],tee)});e.setAttribute('x1',p[0]);e.setAttribute('y1',p[1]);e.setAttribute('x2',p[2]);e.setAttribute('y2',p[3]);e.setAttribute('stroke-width',go>0?w:0);});
    he.setAttribute('opacity',nm);he.setAttribute('transform','translate('+lerp(-14,0,nm)+',0)');
    var sn=ease(seg(s,4.3,5.1));st.setAttribute('opacity',sn);st.setAttribute('transform','translate('+lerp(-18,0,sn)+',0)');
  }
  var t0=null,done=false;
  function tick(now){if(done)return;if(t0===null)t0=now;var s=(now-t0)/1000;frame(Math.min(s,5.2));if(s<6)requestAnimationFrame(tick);else leave();}
  function leave(){
    if(done)return;done=true;frame(5.2);
    var a=$('#wm').getBoundingClientRect(),b=$('#logotxt').getBoundingClientRect();
    var sc=b.width/(a.width*.82);
    // le nom file vers la place du logo
    var cx=a.left,cy=a.top,wm=$('#wm');wm.style.transition='none';wm.style.left=cx+'px';wm.style.top=cy+'px';wm.style.transform='none';
    requestAnimationFrame(function(){requestAnimationFrame(function(){wm.style.transition='';wm.style.transform='translate('+(b.left-cx-a.width*.09*sc)+'px,'+(b.top-cy-a.height*.40*sc)+'px) scale('+sc+')';});});
    $('#skip').style.opacity=0;

    setTimeout(function(){app.classList.add('open');measure();},1100);
    setTimeout(function(){$('#intro').remove()},1900);
  }
  $('#skip').addEventListener('click',leave);$('#intro').addEventListener('click',leave);
  if(reduce){frame(5.2);setTimeout(leave,400);}else requestAnimationFrame(tick);

  /* ---------- Menu à rubriques ---------- */
  var menu=$('#menu'),filt=null,closeT,GL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/·+';
  function count(k,sub){return W.filter(function(w){return w.cat===k&&(!sub||w.sub===sub)}).length}
  function decode(el,delay){var fin=el.dataset.t,k=0;clearInterval(el._t);setTimeout(function(){el._t=setInterval(function(){k+=.5;el.firstChild.textContent=fin.split('').map(function(c,i){return i<k||c===' '?c:GL[Math.random()*GL.length|0]}).join('');if(k>=fin.length)clearInterval(el._t);},28);},delay);}
  MENU.forEach(function(m){var g=document.createElement('div');g.className='grp';
    g.innerHTML='<button type="button" class="cat u">'+m.k+'</button><span class="subs">'+m.subs.map(function(s){return '<button type="button" class="u" data-s="'+s+'" data-t="'+s+'"><span>'+s+'</span><sup>'+p2(count(m.k,s))+'</sup></button>'}).join('')+'</span>';

  /* ---------- Ruban WebGL ---------- */
  (function(){
    var cv=$('#gl'),gl=cv.getContext('webgl',{antialias:true,premultipliedAlpha:false});
    if(!gl||reduce)return;
    var VS='attribute vec2 a;uniform vec4 uR;uniform vec2 uRes;uniform float uBend,uRev;varying vec2 vUv;void main(){vec2 q=a;float h=uR.w*uRev;float y=uR.y+(uR.w-h)*.5+q.y*h;float x=uR.x+q.x*uR.z;float nx=(x/uRes.x)*2.-1.;y+=uBend*(1.-nx*nx);vUv=vec2(q.x,q.y);gl_Position=vec4(x/uRes.x*2.-1.,1.-y/uRes.y*2.,0.,1.);}';
    var FS='precision mediump float;uniform sampler2D t;uniform vec4 uUv;uniform float uSat,uDim,uShift;varying vec2 vUv;vec3 S(vec2 o){vec2 u=uUv.xy+vUv*uUv.zw+o;return texture2D(t,u).rgb;}void main(){float r=S(vec2(uShift,0.)).r;float g=S(vec2(0.)).g;float b=S(vec2(-uShift,0.)).b;vec3 c=vec3(r,g,b);float l=dot(c,vec3(.299,.587,.114));vec3 o=mix(vec3(l)*.86,c,uSat);gl_FragColor=vec4(o*uDim,1.);}';
    function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o}
    var pr=gl.createProgram();try{gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));}catch(e){return}
    gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;gl.useProgram(pr);
    // une bande de 12 colonnes pour que la courbure reste lisse sur une lamelle ouverte
    var N=12,v=[];for(var k=0;k<N;k++){var a0=k/N,a1=(k+1)/N;v.push(a0,0,a1,0,a0,1,a0,1,a1,0,a1,1)}
    var bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.STATIC_DRAW);
    var la=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
    var U={};['uR','uRes','uBend','uRev','uUv','uSat','uDim','uShift','t'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n)});
    var tex=[],asp=[];
    W.forEach(function(w,i){var tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([12,13,14,255]));
      ['TEXTURE_WRAP_S','TEXTURE_WRAP_T'].forEach(function(p){gl.texParameteri(gl.TEXTURE_2D,gl[p],gl.CLAMP_TO_EDGE)});gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      tex[i]=tx;asp[i]=1;var im=new Image();im.onload=function(){asp[i]=im.naturalWidth/im.naturalHeight;gl.bindTexture(gl.TEXTURE_2D,tx);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);};im.src=w.src[0];});
    document.documentElement.classList.add('gl');
    var dpr=Math.min(2,devicePixelRatio||1),VW,VH;
    function size(){VW=innerWidth;VH=innerHeight;cv.width=VW*dpr;cv.height=VH*dpr;gl.viewport(0,0,cv.width,cv.height)}size();addEventListener('resize',size);
    var BASE=58,OPEN=Math.max(220,Math.min(360,innerWidth*.22)),GAP=10,wd=W.map(function(){return BASE}),x=0,vel=0,sv=0,hi=-1,dr=null,inst=[],t0=null,mx=-1,my=-1,sat=W.map(function(){return 0}),dim=W.map(function(){return 1});
    function H(){return Math.min(VH*.52,480)}
    function off(i){var f=PF;if(!f)return false;var w=W[i];return !(w.cat===f.k&&(!f.sub||w.sub===f.sub))}
    function layout(){var tot=0;wd.forEach(function(w){tot+=w+GAP});var s=((x%tot)+tot)%tot-tot,i=0,px=s;inst=[];var y=(VH-H())/2;
      while(px<VW+OPEN){inst.push({i:i,x:px,y:y,w:wd[i],h:H()});px+=wd[i]+GAP;i=(i+1)%W.length;}}
    function pick(){if(my<0)return -1;var y=(VH-H())/2;if(my<y||my>y+H())return -1;for(var k=0;k<inst.length;k++){var q=inst[k];if(mx>=q.x&&mx<=q.x+q.w)return k}return -1}
    var hovInst=null;
    function frame(now){var dt=Math.min(50,now-(frame.l||now))/16.67;frame.l=now;
      if(!dr){var base=hi>=0?0:.35;vel+=(base-vel)*.05*dt;x-=vel*dt;}
      sv+=(vel-sv)*.18;
      layout();var k=pick();var ni=k>=0?inst[k].i:-1;
      if(anyOpen())ni=-1;

      hovInst=k>=0?inst[k]:null;
      wd=wd.map(function(w,i){return w+((i===hi?OPEN:BASE)-w)*.12*dt});
      var started=app.classList.contains('open');if(started&&t0===null)t0=now;
      gl.clearColor(.024,.027,.031,1);gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(U.uRes,VW,VH);var speed=Math.abs(sv);
      gl.uniform1f(U.uBend,-Math.min(46,speed*2.2)*(VH>VW?.5:1));gl.uniform1f(U.uShift,Math.max(-.012,Math.min(.012,sv*.0011)));

        var td=off(i)?.12:(hi>=0&&i!==hi?.55:1);dim[i]+=(td-dim[i])*.12;
        var rv=t0===null?0:Math.max(0,Math.min(1,((now-t0)/1000-j*.028)/1));rv=rv<.5?4*rv*rv*rv:1-Math.pow(-2*rv+2,3)/2;
        // recadrage « cover »

        gl.uniform4f(U.uR,q.x,q.y,q.w,q.h);gl.uniform4f(U.uUv,(1-sx)/2,(1-sy)/2,sx,sy);gl.uniform1f(U.uSat,sat[i]);gl.uniform1f(U.uDim,dim[i]);gl.uniform1f(U.uRev,rv);

    addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;if(dr){var dx=e.clientX-dr.x;dr.x=e.clientX;dr.m+=Math.abs(dx);x+=dx;vel=-dx;}});
    cv.addEventListener('pointerdown',function(e){dr={x:e.clientX,m:0}});
    addEventListener('pointerup',function(){if(!dr)return;var m=dr.m;dr=null;if(m<6&&hovInst){var q=hovInst;openW({dataset:{i:q.i},getBoundingClientRect:function(){var y=(VH-H())/2,qq=inst.filter(function(z){return z.i===q.i})[0]||q;return {left:qq.x,top:y,width:qq.w,height:H()}}});}});
    cv.addEventListener('pointerleave',function(){mx=my=-1});
    addEventListener('wheel',function(e){if(anyOpen())return;vel+=(e.deltaY+e.deltaX)*.025;},{passive:true});
  })();
